<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1419" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Diagnosis flow chart"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1180" height="1419" fill="#ffffff"/><text x="40" y="44" font-size="26" font-weight="800" fill="#15171a" text-anchor="start">How the GNSS guard diagnoses the problem</text><text x="40" y="70" font-size="15" font-weight="400" fill="#444" text-anchor="start">Every second, all 10 checks run in this order. The FIRST one that answers “yes” decides the verdict.</text><text x="40" y="92" font-size="13" font-weight="400" fill="#666" text-anchor="start" font-style="italic">A check without data this second (e.g. no satellites, no GNSS position) is skipped: it neither passes nor fails.</text><rect x="280.0" y="102" width="300" height="34" rx="17" fill="#1d2733"/><text x="430.0" y="124" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">New GNSS reading + ship sensors</text><line x1="430.0" y1="136" x2="430.0" y2="148" stroke="#333" stroke-width="2" marker-end="url(#head)"/><polygon points="168,150 692,150 710,182.0 692,214 168,214 150,182.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="172" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">1. Noise floor</text><text x="184" y="191" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Is the background radio noise more than +3 dB above its learned normal?</text><line x1="710" y1="182.0" x2="798" y2="182.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="174.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="150" width="340" height="64" rx="10" fill="#e34948"/><text x="816" y="175" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">JAMMING</text><text x="816" y="194" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">a transmitter is drowning the satellite signals</text><line x1="430.0" y1="214" x2="430.0" y2="240" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="234" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,242 692,242 710,274.0 692,306 168,306 150,274.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="264" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">2. Satellite count</text><text x="184" y="283" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Are fewer than 5 satellites tracked, or is there no position?</text><line x1="710" y1="274.0" x2="798" y2="274.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="266.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="242" width="340" height="64" rx="10" fill="#eb6834"/><text x="816" y="267" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">LOST</text><text x="816" y="286" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">too few satellites to fix and cross-check</text><line x1="430.0" y1="306" x2="430.0" y2="332" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="326" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,334 692,334 710,366.0 692,398 168,398 150,366.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="356" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">3. Signal strength drop</text><text x="184" y="375" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Are the satellites on average more than 8 dB quieter than normal?</text><line x1="710" y1="366.0" x2="798" y2="366.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="358.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="334" width="340" height="64" rx="10" fill="#e34948"/><text x="816" y="359" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">JAMMING</text><text x="816" y="378" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">all signals covered by noise at once</text><line x1="430.0" y1="398" x2="430.0" y2="424" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="418" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,426 692,426 710,458.0 692,490 168,490 150,458.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="448" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">4. Signal spread</text><text x="184" y="467" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Do the satellites differ in strength by less than 2 dB-Hz (std-dev)?</text><line x1="710" y1="458.0" x2="798" y2="458.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="450.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="426" width="340" height="64" rx="10" fill="#6250d6"/><text x="816" y="451" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">SPOOFING</text><text x="816" y="470" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">one transmitter faking many satellites</text><line x1="430.0" y1="490" x2="430.0" y2="516" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="510" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,518 692,518 710,550.0 692,582 168,582 150,550.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="540" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">5. Signal strength rise</text><text x="184" y="559" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Are the satellites on average more than 5 dB louder than normal?</text><line x1="710" y1="550.0" x2="798" y2="550.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="542.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="518" width="340" height="64" rx="10" fill="#6250d6"/><text x="816" y="543" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">SPOOFING</text><text x="816" y="562" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">louder than satellites 20,000 km away can be</text><line x1="430.0" y1="582" x2="430.0" y2="608" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="602" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,610 692,610 710,642.0 692,674 168,674 150,642.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="632" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">6. Clock consistency</text><text x="184" y="651" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Has the receiver clock jumped more than 0.1 s from normal?</text><line x1="710" y1="642.0" x2="798" y2="642.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="634.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="610" width="340" height="64" rx="10" fill="#6250d6"/><text x="816" y="635" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">SPOOFING</text><text x="816" y="654" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">fake signals carry wrong time</text><line x1="430.0" y1="674" x2="430.0" y2="700" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="694" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,702 692,702 710,734.0 692,766 168,766 150,734.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="724" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">7. Position vs dead reckoning</text><text x="184" y="743" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Is GNSS further from dead reckoning than the gate (3 x uncertainty + 10 m)?</text><line x1="710" y1="734.0" x2="798" y2="734.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="726.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="702" width="340" height="64" rx="10" fill="#6250d6"/><text x="816" y="727" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">SPOOFING</text><text x="816" y="746" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">the ship cannot have moved there</text><line x1="430.0" y1="766" x2="430.0" y2="792" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="786" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,794 692,794 710,826.0 692,858 168,858 150,826.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="816" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">8. Position on water</text><text x="184" y="835" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Is the GNSS position on land according to the chart?</text><line x1="710" y1="826.0" x2="798" y2="826.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="818.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="794" width="340" height="64" rx="10" fill="#6250d6"/><text x="816" y="819" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">SPOOFING</text><text x="816" y="838" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">a ship cannot be on land</text><line x1="430.0" y1="858" x2="430.0" y2="884" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="878" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,886 692,886 710,918.0 692,950 168,950 150,918.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="908" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">9. Depth vs chart</text><text x="184" y="927" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Does the sounder disagree with the chart depth at the GNSS position by more than</text><text x="184" y="943" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">0.2 x depth + 5 m?</text><line x1="710" y1="918.0" x2="798" y2="918.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="910.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="886" width="340" height="64" rx="10" fill="#6250d6"/><text x="816" y="911" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">SPOOFING</text><text x="816" y="930" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">the water under the keel says we are elsewhere</text><line x1="430.0" y1="950" x2="430.0" y2="976" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="970" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><polygon points="168,978 692,978 710,1010.0 692,1042 168,1042 150,1010.0" fill="#f4f6fa" stroke="#1d2733" stroke-width="1.5"/><text x="184" y="1000" font-size="15" font-weight="700" fill="#15171a" text-anchor="start">10. Position agreement</text><text x="184" y="1019" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">Is GNSS further from dead reckoning than half the gate?</text><line x1="710" y1="1010.0" x2="798" y2="1010.0" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="736" y="1002.0" font-size="13" font-weight="700" fill="#333" text-anchor="start">yes</text><rect x="800" y="978" width="340" height="64" rx="10" fill="#eda100"/><text x="816" y="1003" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start">DEGRADED</text><text x="816" y="1022" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">noisy but possible: blend with dead reckoning</text><line x1="430.0" y1="1042" x2="430.0" y2="1068" stroke="#333" stroke-width="2" marker-end="url(#head)"/><text x="440.0" y="1062" font-size="13" font-weight="700" fill="#333" text-anchor="start">no</text><line x1="118" y1="150" x2="118" y2="674" stroke="#8a8986" stroke-width="3"/><text x="100" y="412.0" font-size="15" font-weight="700" fill="#6b6f76" text-anchor="middle" transform="rotate(-90 100 412.0)">Signal checks</text><line x1="118" y1="702" x2="118" y2="1042" stroke="#8a8986" stroke-width="3"/><text x="100" y="872.0" font-size="15" font-weight="700" fill="#6b6f76" text-anchor="middle" transform="rotate(-90 100 872.0)">Position checks</text><rect x="260.0" y="1070" width="340" height="64" rx="10" fill="#008300"/><text x="430.0" y="1097" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">All checks passed: verdict OK</text><text x="430.0" y="1117" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle">GNSS can be used</text><text x="40" y="1204" font-size="20" font-weight="800" fill="#15171a" text-anchor="start">Then: what the verdict does to the ship&#x27;s state</text><rect x="40.0" y="1222" width="353.3333333333333" height="172" rx="10" fill="#ffffff" stroke="#e34948" stroke-width="3"/><rect x="40.0" y="1222" width="353.3333333333333" height="34" rx="10" fill="#e34948"/><text x="54.0" y="1245" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start">Verdict LOST / JAMMING / SPOOFING</text><text x="54.0" y="1278" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• State becomes that alarm.</text><text x="54.0" y="1300" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• Ignore GNSS: navigate on dead reckoning +</text><text x="66.0" y="1318" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">radar, depth and any aid.</text><text x="54.0" y="1340" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• Clean-second count reset to 0; 60 clean</text><text x="66.0" y="1358" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">seconds needed.</text><rect x="413.3333333333333" y="1222" width="353.3333333333333" height="172" rx="10" fill="#ffffff" stroke="#eda100" stroke-width="3"/><rect x="413.3333333333333" y="1222" width="353.3333333333333" height="34" rx="10" fill="#eda100"/><text x="427.3333333333333" y="1245" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start">Verdict DEGRADED</text><text x="427.3333333333333" y="1278" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• From TRUSTED: state DEGRADED; 10 clean seconds</text><text x="439.3333333333333" y="1296" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">needed.</text><text x="427.3333333333333" y="1318" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• Already DEGRADED: count reset to 0.</text><text x="427.3333333333333" y="1340" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• On backup (alarm or RECOVERING): count paused.</text><rect x="786.6666666666666" y="1222" width="353.3333333333333" height="172" rx="10" fill="#ffffff" stroke="#008300" stroke-width="3"/><rect x="786.6666666666666" y="1222" width="353.3333333333333" height="34" rx="10" fill="#008300"/><text x="800.6666666666666" y="1245" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start">Verdict OK</text><text x="800.6666666666666" y="1278" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• TRUSTED: stay TRUSTED, use GNSS, learn what</text><text x="812.6666666666666" y="1296" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">normal looks like.</text><text x="800.6666666666666" y="1318" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• Otherwise count +1. When it reaches the need:</text><text x="812.6666666666666" y="1336" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">TRUSTED again.</text><text x="800.6666666666666" y="1358" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">• Until then, after an alarm: RECOVERING (still</text><text x="812.6666666666666" y="1376" font-size="13" font-weight="400" fill="#15171a" text-anchor="start">on backup).</text></svg>