<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GNSS Guard Bridge</title>
  <link rel="stylesheet" href="css/navigator.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the ship status</a>
  <div class="layout">
    <aside class="sidebar" aria-label="Controls">
      <h1 class="brand">GNSS Guard <span class="sr-only">bridge view</span></h1>
      <label for="mode">Mode</label>
      <select id="mode" autocomplete="off">
        <option value="voyage">Baltic voyage (3 h)</option>
        <option value="short">Short run (15 min)</option>
      </select>
      <label for="scenario">Scenario</label>
      <select id="scenario" autocomplete="off"></select>
      <label for="solution">Solution</label>
      <select id="solution" autocomplete="off"></select>
      <label for="speed">Playback</label>
      <select id="speed" autocomplete="off"></select>
      <button id="play" type="button" aria-pressed="false">▷ Play</button>
    </aside>

    <main id="main" tabindex="-1">
      <div id="error" class="error" role="alert" hidden></div>
      <p id="loading" class="loading" role="status">Loading...</p>
      <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
      <div class="clock">
        <span id="clock">00:00:00</span>
        <input id="time" type="range" min="0" max="0" value="0" aria-label="Voyage time">
      </div>

      <div class="top">
        <section id="status" class="panel status" aria-label="Ship status">
          <div class="confidence">Confidence <b id="confidence">-</b></div>
          <div id="state" class="state">-</div>
          <div id="state-line" class="state-line"></div>
          <div id="solution-line" class="solution-line"></div>
          <div id="vitals" class="vitals"></div>
        </section>

        <section class="panel instructions">
          <h2>Live instructions</h2>
          <ol id="instructions" class="log"></ol>
        </section>
      </div>

      <section class="checks-area">
        <h2>10 checks <span class="legend"><span aria-hidden="true">✓</span> good
          <span aria-hidden="true">✗</span> bad <span aria-hidden="true">–</span> no data</span></h2>
        <ul id="checks" class="checks"></ul>
      </section>

      <div class="bottom">
        <section class="panel map-panel">
          <div class="map-head"><h2>Live map</h2><span id="map-legend" class="map-legend"></span></div>
          <div id="map" class="map" role="img" aria-label="Live map"></div>
        </section>
        <section class="panel signal-panel">
          <div class="map-head"><h2>GPS signal</h2><span id="signal-status" class="signal-badge"></span></div>
          <div id="signal" class="map" role="img" aria-label="GPS signal graph"></div>
          <div id="signal-legend" class="map-legend"></div>
        </section>
      </div>

      <section class="panel accuracy-panel">
        <div class="map-head"><h2>Accuracy (against the simulated truth)</h2>
          <span id="accuracy-badge" class="signal-badge"></span></div>
        <div class="accuracy">
          <div class="accuracy-now">
            <div class="vital"><span>Actual error</span><b id="acc-error">-</b></div>
            <div class="vital"><span>Ship's own estimate</span><b id="acc-claimed">-</b></div>
            <div class="vital"><span>Method</span><b id="acc-method">-</b></div>
          </div>
          <div id="accuracy-chart" class="acc-chart" role="img" aria-label="Accuracy over time"></div>
          <div id="accuracy-table" class="acc-table"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- Everything is inside this folder; data/ is written by `python export_web.py`. -->
  <script src="js/data.js"></script>
  <script src="vendor/plotly.min.js"></script>
  <script src="data/content.js"></script>
  <script src="js/navigator.js"></script>
</body>
</html>
